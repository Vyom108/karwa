<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | Karwa Tours & Travels</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/policies.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html"><img class="logo" src="assets/images/karwa-logo-180.webp" width="180" height="184" decoding="async" alt="Karwa Tours &amp; Travels logo"><span><b>KARWA</b><small>TOURS &amp; TRAVELS</small></span></a>
    <a class="btn small" href="index.html">Back to website</a>
  </header>
  <main class="policy-main reset-main">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Choose a new password.</h1>
    <p id="resetStatus" class="form-status" role="status" aria-live="polite">Checking your secure reset link…</p>
    <form id="resetForm" class="reset-form" hidden>
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp"></label>
      <small id="passwordHelp">Use at least 8 characters.</small>
      <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <p id="resetError" class="form-error" role="alert" aria-live="assertive"></p>
      <button class="btn" type="submit">Update password</button>
    </form>
    <p id="resetReturn" hidden><a class="btn" href="index.html">Return to Karwa</a></p>
  </main>
  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
