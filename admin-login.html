<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Karwa Tours & Travels | Admin sign in</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="nav"><a class="brand" href="index.html"><img class="logo" src="assets/images/karwa-logo-clean.png" alt="Karwa Tours & Travels logo"><span><b>KARWA</b><small>ADMIN ACCESS</small></span></a><a class="btn small" href="index.html">View website</a></header>
  <main class="admin-login">
    <p class="eyebrow">AUTHORIZED STAFF ONLY</p>
    <h1>Admin sign in</h1>
    <p>Sign in with the account invited by the site owner. Admin access is checked securely before the dashboard opens.</p>
    <form id="adminLoginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in securely</button>
      <button class="outline" id="adminForgotPassword" type="button">Send password reset email</button>
    </form>
    <p id="adminLoginStatus" class="admin-status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
